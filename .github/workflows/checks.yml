name: Validate research and tools
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-26
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved 2026-10-26
        with:
          python-version: '3.12'
      - name: Check source register and internal links
        run: python scripts/check_research.py
      - name: Verify research catalog and generated Explorer
        run: python scripts/build_research_explorer.py --check
      - name: Test benchmark and research guards
        run: python -m unittest discover -s tests -v
      - name: Verify content-addressed browser assets
        run: python scripts/build_card_lab.py --check
      - name: Verify public media asset identities
        run: python scripts/build_media_lab.py --check
      - name: Test all JavaScript contracts and browser harness invariants
        run: node --test tests/*.test.mjs
      - name: Exercise explicitly synthetic benchmark example
        run: python scripts/compare_benchmarks.py tests/fixtures/synthetic-baseline.json tests/fixtures/synthetic-candidate.json
  rust-lab:
    name: Rust lab (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/atlas-lab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned official Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Static checks
        run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - name: Offline unit and differential stress tests
        run: |
          cargo +1.99.1 test --locked
          cargo +1.99.1 test --locked --example version_validation_lab
          cargo +1.99.1 test --locked --example upstream_validation_lab
          cargo +1.99.1 test --locked --example project_process_memory_lab
      - name: Isolated lossless storage candidate checks
        working-directory: experiments/compressed-snapshot-lab
        run: |
          cargo +1.99.1 fmt --all -- --check
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings
          cargo +1.99.1 test --locked
