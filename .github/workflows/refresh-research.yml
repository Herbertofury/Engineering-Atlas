name: Refresh research snapshots (manual)

on:
  workflow_dispatch:
    inputs:
      max_repos:
        description: Maximum repository metadata requests in this pass
        type: number
        default: 200
        required: true

permissions:
  contents: read
  issues: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Read public signals and reviewed reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEARCH_MAX_REPOS: ${{ inputs.max_repos }}
        run: python scripts/refresh_research_signals.py --only all --max-repos "$RESEARCH_MAX_REPOS"
      - name: Validate and rebuild the Explorer snapshot
        run: |
          python scripts/build_research_explorer.py
          python scripts/build_research_explorer.py --check
          python scripts/check_research.py
          python -m unittest discover -s tests -p 'test_research*.py' -v
      - name: Save a reviewable snapshot (does not commit or deploy)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, resolved 2026-10-28
        with:
          name: research-snapshot-for-review
          retention-days: 14
          path: |
            data/research-signals.json
            data/research-community.json
            docs/explorer/
            docs/research-catalog.md
          if-no-files-found: error
