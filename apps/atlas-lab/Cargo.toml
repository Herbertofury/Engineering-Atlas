[package]
name = "atlas-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
